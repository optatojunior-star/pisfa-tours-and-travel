; PHP limits for the PISFA document root on Hostinger.
;
; public_html is a symlink to this directory, so PHP reads this file as the
; document-root .user.ini and applies it to every request. Keeping it in git is
; deliberate: changing an upload limit should be a deploy, not an SSH session
; with an editor.
;
; Photographs are already shrunk in the browser before they are sent (see
; config/documents.php), so these are the safety net rather than the mechanism.
; They exist because a 504 Gateway Timeout on saving a tour looks like a bug in
; the application and is usually a PHP or proxy limit being hit silently.

; One photograph, after the browser has resized it, is a few hundred kilobytes.
; 12 MB leaves generous room for an upload that skipped the resize because the
; browser did not support it.
upload_max_filesize = 12M

; Must exceed upload_max_filesize times the number of files in one form, plus
; the rest of the fields. The tour and vehicle forms accept twelve photographs.
post_max_size = 64M

; Time PHP will spend running the request. Storing twelve files is quick; this
; is headroom for a slow disk on shared hosting.
max_execution_time = 120

; Time PHP will spend *receiving* the request body. This is the one that
; matters for a large upload on a slow connection, and the one most often left
; at 60 seconds.
max_input_time = 300

; The tour form posts an itinerary, inclusions and exclusions as arrays, which
; multiply the field count quickly.
max_input_vars = 3000

; Files are streamed to disk rather than read into memory, so this only has to
; cover the application itself.
memory_limit = 256M
